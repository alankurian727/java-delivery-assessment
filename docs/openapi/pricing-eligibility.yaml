openapi: 3.0.3
info:
  title: Pricing and Eligibility API
  version: 1.0.0
  description: Evaluate eligibility and calculate prices for domestic parcel deliveries.
paths:
  /api/v1/pricing/evaluations:
    post:
      operationId: evaluatePricing
      tags:
      - Pricing
      summary: Evaluate delivery eligibility and price
      description: Returns a calculated price for eligible deliveries or a reason for rejection.
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        description: Optional identifier for tracing a request across services. 1-128 printable ASCII
          characters without spaces; generated by the service when absent and returned in the response.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingEvaluationRequest'
            example:
              requestId: 7cb82db3-fe9a-49e1-a0f9-fdeae2455869
              originPostalCode: 1012AB
              destinationPostalCode: 5611EM
              weightInGrams: 2750
              deliveryType: NEXT_DAY
      responses:
        '200':
          description: Pricing evaluation result, including business rejections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingEvaluationResponse'
              examples:
                eligible:
                  value:
                    requestId: 7cb82db3-fe9a-49e1-a0f9-fdeae2455869
                    eligible: true
                    price:
                      amount: 8.95
                      currency: EUR
                    priceComponents:
                    - type: BASE_PRICE
                      amount: 6.95
                    - type: WEIGHT_SURCHARGE
                      amount: 1
                    - type: URBAN_AREA_SURCHARGE
                      amount: 1
                    evaluatedAt: '2026-11-25T08:29:59Z'
                rejected:
                  value:
                    requestId: 7cb82db3-fe9a-49e1-a0f9-fdeae2455869
                    eligible: false
                    rejectionCode: WEIGHT_LIMIT_EXCEEDED
                    message: Parcel exceeds the supported weight.
                    evaluatedAt: '2026-11-25T08:29:59Z'
        '400':
          description: Invalid evaluation request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Invalid evaluation request
                status: 400
                code: VALIDATION_FAILED
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Internal error
                status: 500
                code: INTERNAL_ERROR
components:
  schemas:
    PricingEvaluationRequest:
      type: object
      required:
      - requestId
      - originPostalCode
      - destinationPostalCode
      - weightInGrams
      - deliveryType
      properties:
        requestId:
          type: string
          format: uuid
        originPostalCode:
          type: string
          pattern: ^[1-9][0-9]{3} ?[A-Za-z]{2}$
          description: Dutch postal code, with or without a space (e.g. 1012AB or 1012 AB). Case-insensitive;
            normalized to uppercase without a space (1012AB) before pricing and idempotency comparison.
          example: 1012 AB
        destinationPostalCode:
          type: string
          pattern: ^[1-9][0-9]{3} ?[A-Za-z]{2}$
          description: Dutch postal code, with or without a space (e.g. 1012AB or 1012 AB). Case-insensitive;
            normalized to uppercase without a space (1012AB) before pricing and idempotency comparison.
          example: 1012 AB
        weightInGrams:
          type: integer
          format: int64
          minimum: 1
          description: Parcel weight in grams. Deliveries above 20,000 grams are not eligible.
        deliveryType:
          $ref: '#/components/schemas/DeliveryType'
    DeliveryType:
      type: string
      enum:
      - STANDARD
      - NEXT_DAY
      - SAME_DAY
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: number
          minimum: 0
          description: Amount in euros with at most two decimal places.
          example: 8.95
        currency:
          type: string
          enum:
          - EUR
    PriceComponent:
      type: object
      required:
      - type
      - amount
      properties:
        type:
          type: string
          description: 'Price component type. Known values: BASE_PRICE, WEIGHT_SURCHARGE, URBAN_AREA_SURCHARGE.
            New pricing strategies may add values; clients must tolerate unknown types.'
          example: BASE_PRICE
        amount:
          type: number
          minimum: 0
          description: Amount in euros with at most two decimal places.
          example: 8.95
    PricingEvaluationResponse:
      description: Eligible or rejected result, distinguished by the eligible flag. Additional properties may
        be added; clients must ignore unknown properties.
      oneOf:
      - $ref: '#/components/schemas/EligibleEvaluation'
      - $ref: '#/components/schemas/RejectedEvaluation'
    EligibleEvaluation:
      type: object
      required:
      - requestId
      - eligible
      - price
      - priceComponents
      - evaluatedAt
      properties:
        requestId:
          type: string
          format: uuid
        eligible:
          type: boolean
          enum:
          - true
        price:
          $ref: '#/components/schemas/Money'
        priceComponents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PriceComponent'
        evaluatedAt:
          type: string
          format: date-time
    RejectedEvaluation:
      type: object
      required:
      - requestId
      - eligible
      - rejectionCode
      - message
      - evaluatedAt
      properties:
        requestId:
          type: string
          format: uuid
        eligible:
          type: boolean
          enum:
          - false
        rejectionCode:
          type: string
          description: 'Reason the delivery is not eligible. Known values: WEIGHT_LIMIT_EXCEEDED, SAME_DAY_NOT_SUPPORTED.
            New rules may add values; clients must tolerate unknown codes.'
          example: WEIGHT_LIMIT_EXCEEDED
        message:
          type: string
        evaluatedAt:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: 'Machine-readable code identifying the error. Known values: VALIDATION_FAILED,
            REQUEST_NOT_SUPPORTED, INTERNAL_ERROR. Clients must tolerate new values.'
          example: VALIDATION_FAILED
        correlationId:
          type: string
        violations:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
      description: Error details in RFC 9457 Problem Details format. Never includes raw request input,
        personal data, stack traces, database details, internal hostnames or Java class names.
