name: Maven CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pricing-contract-copy:
    name: Pricing contract copy matches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Compare Delivery Order's copy with the Pricing contract
        run: >-
          diff -u
          pricing-eligibility-api/src/main/resources/static/openapi/pricing-eligibility.yaml
          delivery-order-api/src/main/resources/openapi-client/pricing-eligibility.yaml

  verify:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [delivery-order-api, pricing-eligibility-api]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Verify Maven build
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
