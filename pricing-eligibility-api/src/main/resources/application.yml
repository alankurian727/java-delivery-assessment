spring:
  application:
    name: pricing-eligibility-api
  profiles:
    # Profiles: local (developer machine), dev (shared development), prod. Set SPRING_PROFILES_ACTIVE to choose.
    default: local
  jackson:
    default-property-inclusion: non_null
    deserialization:
      use-big-decimal-for-floats: true
      # weightInGrams is an integer in the contract: reject 2750.5 with 400 instead of truncating it to 2750.
      accept-float-as-int: false
    generator:
      write-bigdecimal-as-plain: true

pricing:
  tariff:
    base-prices:
      STANDARD: "4.95"
      NEXT_DAY: "6.95"
      SAME_DAY: "11.95"
    max-weight-in-grams: 20000
    weight-bands:
      - up-to-grams: 2000
        surcharge: "0.00"
      - up-to-grams: 5000
        surcharge: "1.00"
      - up-to-grams: 10000
        surcharge: "2.50"
      - up-to-grams: 20000
        surcharge: "5.00"
    urban-area:
      from: 1000AA
      to: 1099ZZ
      surcharge: "1.00"

springdoc:
  swagger-ui:
    url: /openapi/pricing-eligibility.yaml

server:
  port: 8081

logging:
  pattern:
    # Adds the request's correlation ID to every log line, for example [demo-1].
    correlation: "[%X{correlationId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
