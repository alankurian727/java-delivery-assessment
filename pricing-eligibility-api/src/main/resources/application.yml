spring:
  application:
    name: pricing-eligibility-api
  jackson:
    default-property-inclusion: non_null
    deserialization:
      use-big-decimal-for-floats: true
    generator:
      write-bigdecimal-as-plain: true

springdoc:
  swagger-ui:
    url: /openapi/pricing-eligibility.yaml

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
