# Production.
logging:
  structured:
    format:
      # JSON log lines (Elastic Common Schema): timestamp, level, service.name, correlationId (from the MDC)
      # and every addKeyValue field (event, pricingRequestId, outcome, ...) are separately searchable.
      console: ecs
  level:
    # Frameworks only report problems; their INFO start-up and housekeeping lines are noise in production.
    # The application stays at the INFO default from application.yml, so rule-level DEBUG lines are hidden.
    root: WARN
