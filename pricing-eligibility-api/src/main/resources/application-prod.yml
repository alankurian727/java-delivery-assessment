# Production.
logging:
  structured:
    format:
      # JSON log lines (Elastic Common Schema): timestamp, level, service.name, correlationId (from the MDC)
      # and every addKeyValue field (event, pricingRequestId, outcome, ...) are separately searchable.
      console: ecs
  level:
    root: INFO
management:
  tracing:
    sampling:
      # Export 10% of traces once an exporter is added; trace and span IDs are still logged for every request.
      probability: 0.1
