services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: ${DELIVERY_DB_PASSWORD:-delivery-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "delivery", "-d", "delivery"]
      interval: 5s
      timeout: 3s
      retries: 10

  pricing-eligibility-api:
    build:
      context: .
      dockerfile: pricing-eligibility-api/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  delivery-order-api:
    build:
      context: .
      dockerfile: delivery-order-api/Dockerfile
    environment:
      DELIVERY_DB_URL: jdbc:postgresql://postgres:5432/delivery
      DELIVERY_DB_USER: delivery
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD:-delivery-dev}
      PRICING_BASE_URL: http://pricing-eligibility-api:8081
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
